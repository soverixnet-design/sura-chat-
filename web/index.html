<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover"><title>SURA CHAT</title><style>
:root{--bg:#120a2a;--card:#2b1566;--card2:#3a1d85;--g1:#ffe08a;--g2:#d9a032;--tx:#fff3d6;--mut:#b9a6e6;--pk:#c06bff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#070314;color:var(--tx);font-family:'Hind Siliguri',system-ui,sans-serif;overflow:hidden}
#app{max-width:480px;height:100%;margin:auto;background:radial-gradient(120% 60% at 50% 0,#3b1b8a 0,var(--bg) 60%);position:relative;display:flex;flex-direction:column;overflow:hidden}
.serif{font-family:'Cormorant Garamond',serif;font-style:italic}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.logo{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:26px;color:var(--g1);letter-spacing:1px;text-shadow:0 0 14px #d9a03266}
.ic{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--g2);display:grid;place-items:center;background:#2b156688;font-size:17px}
main{flex:1;overflow-y:auto;padding:0 12px 16px}
nav{display:flex;padding:8px 8px 10px;background:#1a0d3f;border-top:1px solid #d9a03255}
nav button{flex:1;background:none;border:0;color:var(--mut);font:inherit;font-size:12px;padding:6px 0;border-radius:16px}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{background:linear-gradient(#5a3314,#3a1d85);color:var(--g1);box-shadow:inset 0 0 0 1px var(--g2)}
.card{background:linear-gradient(145deg,var(--card2),var(--card));border:1px solid #d9a03266;border-radius:18px;padding:12px;margin-bottom:12px}
.banner{height:140px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;background:linear-gradient(120deg,#4a1f9e,#1d0c4f)}
.banner h2{font-size:30px;color:var(--g1);line-height:1}.banner p{font-size:13px;color:var(--tx);margin:6px 0 10px}
.banner .big{position:absolute;right:10px;top:14px;font-size:84px;filter:drop-shadow(0 0 18px #d9a032);animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
.auth-issue{border:1px solid #ff9e9e;color:#ffe7e7;background:#6d1635aa;padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.45;margin:12px 0}.auth-issue[hidden]{display:none}
.gold{background:linear-gradient(#ffe08a,#d9a032);color:#3a2205;border:0;border-radius:22px;padding:8px 18px;font:600 14px 'Hind Siliguri';box-shadow:0 2px 10px #d9a03255}
.h{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px 8px}.h b{font-size:18px;color:var(--g1)}.h span{font-size:12px;color:var(--mut)}
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.quick div{background:#2b1566;border:1px solid #d9a03266;border-radius:16px;text-align:center;padding:10px 0;font-size:11px}.quick i{display:block;font-style:normal;font-size:22px}
.row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:24px;border:2px solid var(--g2);flex:none;position:relative}
.av img{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%}.av.on::after{content:'';position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#35e07a;border:2px solid #120a2a}
.rm{display:flex;gap:10px;align-items:center;padding:8px}
.rm .th{width:74px;height:62px;border-radius:12px;display:grid;place-items:center;font-size:34px;flex:none}
.rm h4{font-size:16px;color:var(--g1)}.rm small{color:var(--mut);font-size:12px}
.live{background:#e0245e;border-radius:8px;font-size:10px;padding:1px 6px;margin-right:4px}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}.tabs button{flex:none;background:#2b1566;border:1px solid #d9a03255;color:var(--tx);border-radius:16px;padding:7px 14px;font:inherit;font-size:13px}.tabs .on{background:linear-gradient(#ffe08a,#d9a032);color:#3a2205}
.pod{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:6px 0 14px;text-align:center;font-size:13px}.pod .av{width:60px;height:60px;font-size:30px;margin:auto}.pod .f{width:78px;height:78px;font-size:38px}
.li{display:flex;align-items:center;gap:10px;padding:8px 10px;font-size:14px}.li .n{width:22px;color:var(--g1);font-weight:600}.li .s{margin-left:auto;color:#ffb36b}
.ev{display:flex;gap:10px;align-items:center}.ev .e{font-size:40px}.ev h4{color:var(--g1)}.ev small{color:var(--mut)}
.msg{display:flex;gap:10px;align-items:center;padding:10px}.msg .t{margin-left:auto;text-align:right;font-size:11px;color:var(--mut)}.badge{background:var(--g2);color:#3a2205;border-radius:10px;padding:0 7px;display:inline-block;margin-top:3px}
.stat{display:grid;grid-template-columns:repeat(4,1fr);text-align:center}.stat b{display:block;font-size:17px;color:var(--g1)}.stat small{font-size:11px;color:var(--mut)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tiles div{background:#2b1566;border:1px solid #d9a03255;border-radius:14px;text-align:center;padding:10px 2px;font-size:12px}.tiles i{display:block;font-style:normal;font-size:24px}
/* room */
#room{position:absolute;inset:0;background:radial-gradient(100% 50% at 50% 30%,#4b1fa6,#120a2a 70%);display:none;flex-direction:column;z-index:5;padding-top:env(safe-area-inset-top,0px)}#room.show{display:flex}
.rtop{margin:8px 10px;background:linear-gradient(120deg,#4a1f9e,#241058);border:1px solid var(--g2);border-radius:18px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}.rtop h3{font-size:24px;color:var(--g1)}
.seats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 4px;padding:10px 12px;text-align:center;font-size:11px}
.seat{display:flex;flex-direction:column;align-items:center;gap:3px}.seat .av{width:52px;height:52px;background:#3a1d85}
.seat .pl{width:60px;height:12px;border-radius:50%;background:linear-gradient(#7a45e0,#3a1d85);border:1px solid var(--g2)}
.seat.sp .av{box-shadow:0 0 0 3px #c06bff,0 0 18px #c06bff;animation:pu 1s infinite}@keyframes pu{50%{box-shadow:0 0 0 6px #c06bff55,0 0 26px #c06bff}}
.chat{flex:1;overflow-y:auto;margin:0 10px;background:#1a0d3fcc;border:1px solid #d9a03255;border-radius:16px;padding:8px 12px;font-size:13px}.chat p{margin:5px 0}.chat b{color:var(--g1)}
.cin{display:flex;gap:6px;margin:8px 10px 0}.cin input{flex:1;background:#2b1566;border:1px solid #d9a03266;border-radius:20px;color:var(--tx);padding:9px 14px;font:inherit;font-size:14px;outline:0}
.rbar{display:flex;gap:6px;padding:10px;align-items:center}.rbar button{flex:1;background:#2b1566;border:1px solid #d9a03288;color:var(--tx);border-radius:18px;padding:6px 0;font:inherit;font-size:11px}.rbar b{display:block;font-size:20px;font-weight:400}
.rbar .gm{background:linear-gradient(#ffe08a,#d9a032);color:#3a2205;box-shadow:0 0 16px #ffd36a;font-weight:600;animation:gb 2s infinite}@keyframes gb{50%{transform:scale(1.07)}}
.rbar .ex{background:#7a1630;border-color:#ff6b88}
/* sheets */
.sheet{position:absolute;inset:0;background:#000a;z-index:9;display:none;align-items:flex-end}.sheet.show{display:flex}
.pan{width:100%;background:linear-gradient(#2b1566,#180b3d);border-radius:24px 24px 0 0;border-top:2px solid var(--g2);padding:16px;max-height:88%;overflow-y:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.gg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.gg div{background:linear-gradient(145deg,#4a2aa8,#2b1566);border:1px solid var(--g2);border-radius:18px;text-align:center;padding:14px 4px;font-size:14px}.gg i{display:block;font-style:normal;font-size:38px;margin-bottom:4px}
.load{position:absolute;inset:0;z-index:12;background:radial-gradient(circle,#5a24c0,#0d0522);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}.load.show{display:flex}.load i{font-style:normal;font-size:90px;animation:sp 1.4s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.bar{width:60%;height:8px;border-radius:6px;background:#ffffff22;overflow:hidden}.bar u{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffe08a,#d9a032);transition:width 2s linear}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.opt{background:#2b1566;border:2px solid #d9a03255;border-radius:14px;text-align:center;padding:8px 0;font-size:12px}.opt i{display:block;font-style:normal;font-size:30px}.opt.pick{border-color:#ffe08a;background:#5a3aa8}.opt.win{animation:wn .5s 4;border-color:#35e07a}@keyframes wn{50%{background:#35e07a66}}
.bets{display:flex;gap:8px;margin-bottom:10px}.bets button{flex:1;background:#2b1566;border:1px solid var(--g2);color:var(--tx);border-radius:14px;padding:8px;font:inherit}.bets .on{background:var(--g2);color:#3a2205}
.res{min-height:26px;text-align:center;font-size:16px;color:var(--g1);margin-bottom:8px}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#000c;border:1px solid var(--g2);border-radius:20px;padding:8px 16px;font-size:13px;z-index:20;display:none}
.fly{position:absolute;font-size:46px;z-index:15;animation:up 1.6s forwards;pointer-events:none}@keyframes up{to{transform:translateY(-220px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
/* ===== 3D GRAPHICS UPGRADE ===== */
#app::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;background:radial-gradient(2px 2px at 12% 18%,#ffe08a,transparent),radial-gradient(2px 2px at 78% 12%,#fff,transparent),radial-gradient(3px 3px at 90% 40%,#ffd36a,transparent),radial-gradient(2px 2px at 30% 62%,#d9a0ff,transparent),radial-gradient(2px 2px at 64% 82%,#ffe08a,transparent),radial-gradient(3px 3px at 8% 88%,#fff,transparent);animation:tw 4s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.3}to{opacity:1}}
header,main,nav{position:relative;z-index:1}
.logo{background:linear-gradient(#fff6c8 0,#ffd35a 45%,#b87310 55%,#ffe08a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 2px 0 #6b3d05) drop-shadow(0 0 12px #d9a03299);font-size:28px}
.ic{background:radial-gradient(circle at 30% 25%,#6a3bd0,#241058);box-shadow:0 4px 0 #0c0526,0 6px 14px #000a,inset 0 2px 3px #ffffff55}

.card::after{content:'';position:absolute;left:8%;right:8%;top:0;height:1px;background:linear-gradient(90deg,transparent,#fff9,transparent)}
.banner{background:radial-gradient(circle at 85% 40%,#8a3bff 0,#4a1f9e 35%,#1d0c4f 80%)}
.banner::before{content:'';position:absolute;right:-30px;top:-20px;width:200px;height:200px;border-radius:50%;background:conic-gradient(from 0deg,#ffd36a00,#ffd36a66,#ffd36a00,#c06bff66,#ffd36a00);animation:rot 8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.banner .big{z-index:1;font-size:92px;filter:drop-shadow(0 3px 0 #7a4a08) drop-shadow(0 8px 0 #4a2a05) drop-shadow(0 0 22px #ffd36a);animation:fl 3s ease-in-out infinite,tilt 6s ease-in-out infinite}
@keyframes tilt{50%{rotate:y 25deg}}
.gold{position:relative;background:linear-gradient(#fff0a8 0,#ffd35a 40%,#d9962a 60%,#ffd870 100%);box-shadow:0 4px 0 #8a5208,0 7px 14px #0009,inset 0 2px 2px #fffc,inset 0 -3px 5px #b8731066;text-shadow:0 1px 0 #fff8;transition:transform .1s}

.quick div,.tiles div,.tabs button,.rbar button,.opt,.bets button{background:linear-gradient(#5a30c0,#2c1570);border:1px solid #ffd36a77;box-shadow:0 4px 0 #130830,0 8px 12px #0008,inset 0 1.5px 0 #ffffff44}
.tabs .on,.bets .on{background:linear-gradient(#fff0a8,#d9962a)!important;box-shadow:0 4px 0 #8a5208,0 6px 12px #0008,inset 0 2px 2px #fffc!important}
.quick i,.tiles i,.gg i,.opt i,.ev .e,.rm .th{filter:drop-shadow(0 3px 0 #0006) drop-shadow(0 0 8px #ffd36a77)}
.quick div:active,.tiles div:active,.gg div:active,.rm:active{transform:translateY(3px) scale(.98)}
.rm .th{box-shadow:inset 0 3px 6px #fff5,inset 0 -8px 14px #0007,0 4px 10px #000a;border:1px solid #ffd36a99;font-size:38px}
.av{background-image:radial-gradient(circle at 30% 25%,#ffffff55,transparent 55%);border:3px solid transparent;background-clip:padding-box;box-shadow:0 0 0 2px #ffd36a,0 4px 0 #6b3d05,0 8px 12px #000a,inset 0 -6px 10px #0006}
nav{background:linear-gradient(#2a1470,#12082f);box-shadow:0 -6px 18px #000a,inset 0 1.5px 0 #ffd36a99}
nav button.on{background:linear-gradient(#8a4f14,#4a2590);box-shadow:0 4px 0 #130830,inset 0 1.5px 0 #ffd36a,0 0 16px #ffd36a55;transform:translateY(-4px)}
nav button.on b{filter:drop-shadow(0 0 8px #ffd36a)}
.pod{perspective:600px}.pod>div{position:relative}.pod>div::after{content:'';display:block;margin:6px auto 0;width:84px;height:34px;border-radius:8px 8px 0 0;background:linear-gradient(#d9a8ff,#5a2db0);box-shadow:0 6px 0 #130830,inset 0 2px 0 #fff8}.pod>div:nth-child(2)::after{height:56px;width:96px;background:linear-gradient(#fff0a8,#c98a1e)}
.pod .f{box-shadow:0 0 0 3px #ffd36a,0 0 30px #ffd36a,0 5px 0 #6b3d05;animation:pu 2s infinite}
.seat .pl{height:16px;width:64px;background:radial-gradient(ellipse at 50% 30%,#a070ff,#3a1d85 70%);box-shadow:0 5px 0 #130830,0 8px 10px #000a,inset 0 2px 2px #fff6;border-radius:50%}
.seat .av{margin-bottom:-12px;z-index:1}
#room{background:radial-gradient(90% 45% at 50% 28%,#7a3bff55,transparent),radial-gradient(100% 50% at 50% 30%,#4b1fa6,#120a2a 70%)}
#room::before{content:'🎙️';position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:70px;opacity:.14;filter:blur(1px);pointer-events:none}
.rtop{background:linear-gradient(150deg,#6a2fe0,#2a1270);box-shadow:0 5px 0 #130830,0 10px 20px #000a,inset 0 2px 0 #fff4}
.chat{background:linear-gradient(#1a0d3fee,#120a2aee);box-shadow:inset 0 4px 12px #000a}
.rbar .gm{background:linear-gradient(#fff0a8,#d9962a);box-shadow:0 5px 0 #8a5208,0 0 22px #ffd36a,inset 0 2px 2px #fffc;transform-origin:center}
.rbar .gm b{filter:drop-shadow(0 2px 0 #8a5208)}
.rbar .gm::after{content:'';position:absolute;inset:-3px;border-radius:20px;border:2px solid #ffe08a;animation:ring 2s infinite;pointer-events:none}.rbar button{position:relative}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(1.25);opacity:0}}
.pan{background:linear-gradient(#3a1d95,#150a38);box-shadow:0 -8px 30px #000a,inset 0 2px 0 #ffd36a}
.pan::before{content:'';display:block;width:44px;height:5px;border-radius:3px;background:#ffd36a99;margin:-6px auto 10px}
.gg div{background:linear-gradient(160deg,#7a45e8,#3a1d95 55%,#22105a);box-shadow:0 5px 0 #130830,0 10px 16px #000a,inset 0 2px 0 #fff5;transition:transform .1s}
.gg i{font-size:46px;animation:fl 3s ease-in-out infinite}.gg div:nth-child(2n) i{animation-delay:.6s}.gg div:nth-child(3n) i{animation-delay:1.1s}
.load{background:radial-gradient(circle,#7a3bff,#2a0d6a 45%,#0d0522 80%)}
.load i{font-size:110px;filter:drop-shadow(0 4px 0 #7a4a08) drop-shadow(0 10px 0 #4a2a05) drop-shadow(0 0 30px #ffd36a);animation:sp3 2s ease-in-out infinite}@keyframes sp3{50%{transform:rotateY(180deg) scale(1.15)}}
.bar{box-shadow:inset 0 2px 4px #000a}.bar u{box-shadow:0 0 12px #ffd36a}
.opt.pick{background:linear-gradient(#8a5aff,#4a2aa8);transform:translateY(-4px);box-shadow:0 8px 0 #130830,0 0 18px #ffd36a}
.fly{filter:drop-shadow(0 4px 0 #7a4a08) drop-shadow(0 0 22px #ffd36a);font-size:60px}
.stat b{text-shadow:0 2px 0 #6b3d05}
.in{width:100%;background:#1d0e48;border:1px solid #ffd36a77;border-radius:16px;color:var(--tx);padding:12px 14px;font:inherit;font-size:15px;margin-bottom:10px;outline:0;box-shadow:inset 0 3px 8px #000a}
#login{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;padding:24px 18px;overflow-y:auto;background:radial-gradient(100% 50% at 50% 0,#6a2fe0,#120a2a 65%)}
.lbox{width:100%;margin-top:12px}#ll{width:170px;border-radius:34px;box-shadow:0 0 40px #d9a032aa,0 8px 0 #130830}
.soc{display:flex;gap:8px;margin-top:12px}.soc button{flex:1}
.wing{display:flex;justify-content:center;align-items:center;font-size:46px;filter:drop-shadow(0 0 10px #ffd36a)}
.tg{background:#7a3bff;border-radius:10px;padding:1px 8px;font-size:12px;margin:0 3px}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.lv div{background:linear-gradient(#3a2a6a,#241658);border:1px solid #ffd36a66;border-radius:14px;text-align:center;padding:10px 2px;box-shadow:0 4px 0 #130830}.lv b{display:block;font-size:15px;color:var(--g1)}.lv small{font-size:11px;color:var(--mut)}
.or{background:linear-gradient(#ff8a4a,#ff5a1f)!important;border:0!important;font-weight:600}.or2{background:linear-gradient(#ff5a1f,#d6330c)!important;border:0!important}

#evside i{display:block;font-style:normal;font-size:32px;filter:drop-shadow(0 2px 0 #0006)}#evside b{font-size:11px;display:block}#evside small{font-size:10px}
/* room polish */
.seat .pl{display:none}
.seat .av{width:44px;height:44px;font-size:22px;margin-bottom:0;box-shadow:0 0 0 2px #ffd36a,0 4px 8px #000a}
.seat{gap:3px;font-size:11px;text-shadow:0 1px 3px #000}
.seats{padding:4px 10px;gap:10px 2px}
.rtop{padding:6px 12px;margin:6px 10px;border-radius:16px}.rtop h3{font-size:19px}.rtop small{font-size:11px}
.chat{background:transparent;border:0;box-shadow:none;padding:4px 6px}
.chat p{width:fit-content;max-width:88%;margin:6px 0;padding:6px 14px;border-radius:16px;background:linear-gradient(#4a2aa8cc,#22105add);border:1px solid #ffd36a55;box-shadow:0 3px 0 #130830,inset 0 1px 0 #ffffff33}
.cin{position:relative;align-items:center}
.cin .em{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:20px;z-index:1}

.cin .gold{width:44px;height:44px;border-radius:50%;padding:0;font-size:18px;flex:none}
/* icons + daily */
.ib img{display:block;margin:0 auto 2px;filter:drop-shadow(0 3px 3px #0008)}
.rbar button{padding:4px 0}

#room #roomQuickMenu,#room #roomGiftPreview{position:absolute;z-index:17;bottom:110px;left:10px;right:10px;
 border-radius:19px;border:1px solid #ffd36a;background:linear-gradient(#44258a,#1e103e);
 padding:12px;max-height:64%;overflow-y:auto;box-shadow:0 13px 35px #000a}
#room #roomQuickMenu[hidden],#room #roomGiftPreview[hidden]{display:none!important}
#room #roomQuickMenu button{margin:5px 0;min-height:37px;border-radius:11px;border:1px solid #d9a032aa;
 background:linear-gradient(#5b31b1,#302064);color:#fff1de;padding:7px 13px;font:inherit}
#room .ref-menu-header,#room .ref-sheet-top{display:flex;align-items:center;justify-content:space-between}
#room .ref-gift-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:9px}
#room .ref-gift-grid>div{background:#2b155d;border:1px solid #d9a03266;border-radius:12px;padding:9px}
#room .ref-gift-grid b,#room .ref-gift-grid small{display:block;font-size:11px}
#room .ref-gift-grid small{color:#c9afe4;margin-top:4px}
#room .ref-sheet-top button{border:1px solid #ffd36a;background:#3c207c;border-radius:10px;color:#fff;padding:5px 12px}
#room #roomGiftPreview p{font-size:11px;color:#dac7f6;margin-top:9px}
#login{padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(22px + env(safe-area-inset-bottom,0px));overflow-y:auto}
#login .lbox{width:100%;max-width:460px}
#login .form input{min-width:0}
@media(max-width:359px){
 #main .quick{grid-template-columns:repeat(5,minmax(0,1fr));gap:3px}
 #main .quick button{font-size:9px;min-height:60px;padding:6px 1px}
 #room .seats{gap:3px 0;padding:3px 5px}
 #room .seat .av{width:35px;height:35px}
 #room .rbar{gap:5px;padding:5px 7px 7px}
 #room .rbar button{min-height:40px}
}
@media(max-height:670px){
 #room .rtop{margin:3px 6px 6px;min-height:72px;padding:6px}
 #room .seats{gap:3px 0;padding:3px 5px}
 #room .seat .av{width:34px;height:34px}
 #room .ann{margin:1px 7px 3px;padding:2px 6px}
 #room .rbar{padding:4px 7px 7px}
 #room .rbar button{min-height:39px}
 #main .banner{min-height:115px}
}
@media(min-width:600px){#app{max-width:560px}}
@media(prefers-reduced-motion:reduce){#app::before,#main .banner::before,#main .quick button{animation:none!important}}
.room-filters{display:grid;gap:9px}.room-filters label{display:grid;gap:4px;color:var(--mut);font-size:12px}.room-filters input{display:block;min-width:0;width:100%;padding:10px;border:1px solid #d9a03277;border-radius:12px;background:#120a2a;color:var(--tx);font:inherit;font-size:14px}.filter-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}.filter-row .gold{min-height:40px}.filter-actions{display:flex;gap:8px;flex-wrap:wrap}.filter-actions button{border:1px solid #d9a03288;border-radius:15px;padding:7px 14px;color:var(--tx);background:#32205f;font:inherit;font-size:12px}.room-filters small{line-height:1.4}
.member-profile-overlay[hidden]{display:none}.member-profile-overlay{position:absolute;inset:0;z-index:90;background:#070414d9;display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}.member-profile-card{width:min(100%,440px);max-height:80dvh;overflow-y:auto;background:linear-gradient(145deg,#3b2079,#1a0d3f);border:1px solid #d9a032;border-radius:22px;padding:16px;color:var(--tx);box-shadow:0 0 35px #0009}.member-profile-top{display:flex;align-items:center;gap:12px}.member-profile-top .av{flex:none;width:72px;height:72px;font-size:28px}.member-profile-card .profile-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.member-profile-card .profile-actions button{min-height:42px;flex:1}.member-profile-card .profile-name{font-size:20px;color:var(--g1)}.member-profile-card .profile-bio{margin-top:12px;white-space:pre-wrap;overflow-wrap:anywhere}.member-profile-card small{color:var(--mut)}
.social-author{border:0;background:transparent;color:inherit;display:flex;gap:9px;align-items:center;text-align:left;max-width:100%;font:inherit}.social-author .av{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;overflow:hidden;background:#281660}.social-author b,.social-author small{display:block}.social-author small{font-size:11px;color:var(--mut)}.thread-card{display:flex;align-items:center;gap:8px}.thread-chat{min-width:0;flex:1;border:0;background:transparent;text-align:left;color:inherit;display:grid;gap:4px;overflow:hidden}.thread-chat small{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dm-member-profile{width:100%;margin-bottom:12px}
.member-report-form{margin-top:12px;border-top:1px solid #d9a03266;padding-top:12px}.member-report-form[hidden]{display:none!important}.member-report-form select{width:100%;padding:10px;border:1px solid #d9a03266;border-radius:10px;background:#271454;color:var(--tx)}.chat-member-name{border:0;background:transparent;color:var(--g1);font:inherit;font-weight:bold;padding:0;margin:0;text-align:left}.profile-actions{flex-wrap:wrap}
.profile-social-stats{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:10px auto 5px}
.profile-social-stats span{display:inline-grid;gap:2px;min-width:74px;padding:7px 12px;border:1px solid #d9a03288;border-radius:13px;background:#23114b;color:#ffdf8b;text-align:center;font-weight:700}
.profile-social-stats small{font-size:10px;color:#d6c4f2;font-weight:400}
</style></head><body>

 function toast(msg){let x=E("toast");x.textContent=String(msg);x.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>x.style.display="none",3600);}
 const AUTH_STORAGE_KEY="sura.auth.session.v1";
 function forgetSavedLogin(){
  try{localStorage.removeItem(AUTH_STORAGE_KEY);}catch(e){console.warn("Could not erase local session",e.name);}
 }
 function readSavedLogin(){
  try{
   const data=JSON.parse(localStorage.getItem(AUTH_STORAGE_KEY)||"null");
   if(!data||typeof data.token!=="string"||!/^[\w-]{40,64}$/.test(data.token))return null;
   if(!Number.isFinite(data.expires_at)||data.expires_at<=Date.now()+10000){forgetSavedLogin();return null;}
   return data;
  }catch(e){return null;}
 }
 function rememberLogin(token,seconds){
  if(typeof token!=="string"||!/^[\w-]{40,64}$/.test(token))return false;
  const duration=Math.min(7*24*3600,Math.max(300,Number(seconds)||7*24*3600));
  try{localStorage.setItem(AUTH_STORAGE_KEY,JSON.stringify({token,expires_at:Date.now()+duration*1000}));return true;}
  catch(e){console.warn("Login session storage unavailable",e.name);return false;}
 }
 async function restoreSavedLogin(){
  const saved=readSavedLogin();
  if(!saved||S.token)return;
  const ticket=++S.authGeneration;
  const issue=E("authIssue");
  if(issue){issue.hidden=false;issue.textContent="Checking your saved SURA CHAT login…";}
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),13000);
  try{
   const res=await fetch(API+"/api/v1/me",{
    headers:{Authorization:"Bearer "+saved.token,Accept:"application/json"},
    cache:"no-store",signal:controller.signal
   });
   const data=await res.json().catch(()=>({error:"invalid_response"}));
   if(ticket!==S.authGeneration)return;
   if(res.status===401){forgetSavedLogin();throw Error("session_expired");}
   if(!res.ok)throw Error(data.error||"server_unavailable");
   if(!data.user||!data.user.public_id)throw Error("invalid_response");
   S.token=saved.token;S.user=data.user;
   startApp();
  }catch(error){
   if(ticket!==S.authGeneration)return;
   if(error.name==="AbortError")showAuthIssue("Saved login check timed out. Retry when online or sign in manually.");
   else if(error.message==="session_expired")showAuthIssue("Your saved login expired. Please sign in again.");
   else showAuthIssue("Could not check saved login: "+String(error.message||"Network problem")+". Retry or sign in manually.");
  }finally{clearTimeout(timer);}
 }
 async function api(path,method="GET",payload){
  const requestToken=S.token;
  const headers={Accept:"application/json"};if(requestToken)headers.Authorization="Bearer "+requestToken;if(payload!==undefined)headers["Content-Type"]="application/json";
  const c=new AbortController(),timer=setTimeout(()=>c.abort(),15000);
  try{const r=await fetch(API+path,{method,headers,body:payload===undefined?undefined:JSON.stringify(payload),signal:c.signal,cache:"no-store"});const j=await r.json().catch(()=>({error:"invalid_response"}));if(!r.ok){
    if(r.status===401&&requestToken&&S.token===requestToken&&
       (j.error==="session_expired"||j.error==="login_required")){
      showLogin(true);showAuthIssue("Session expired. Please sign in again.");
    }
    throw Error(j.error||"HTTP "+r.status);
   }return j;}
  catch(e){throw Error(e.name==="AbortError"?"Connection timeout":e instanceof TypeError?"network_unavailable":e.message);}finally{clearTimeout(timer);}
 }

 function authMessage(error,signup){
  const code=String(error&&error.message||"unknown");
  if(code==="invalid_credentials")return "Email or password is incorrect. If this is your first time in SURA CHAT, choose Sign Up.";
  if(code==="account_exists")return "This email already has a SURA CHAT account. Select Login and use its password.";
  if(code==="invalid_signup")return "Enter your name, a valid email and a password of 10–64 characters including letters and numbers. Country code: 2 letters. No OTP is required.";
  if(code==="rate_limited"||code==="too_many_requests")return "Too many attempts. Try again later.";
  if(code==="Connection timeout"||code==="network_unavailable"||code==="Failed to fetch"||code==="Network request failed")return "Cannot reach the SURA CHAT server. Check your internet or mobile data and try again.";
  if(code==="invalid_response")return "The login server returned an unexpected reply. Please retry.";
  if(code==="session_expired")return "Session expired. Please sign in again.";
  return "Login problem: "+code;
 }

function nav(){

 .map(o=>'<button type="button" data-act="tab" data-value="'+o[0]+'" class="'+(S.tab===o[0]||(o[0]==="profile"&&["reports","blocked","following","moderation"].includes(S.tab))?'on':'')+'"><b>'+refImg(o[1],27)+'</b>'+o[2]+'</button>').join("");

function roomCards(limit){
 const search=S.tab==="rooms"?String(S.roomSearch||"").trim().toLocaleLowerCase():"";
 const rooms=(S.rooms||[]).filter(r=>!search||String(r.name||"").toLocaleLowerCase().includes(search)).slice(0,Number.isInteger(limit)?limit:undefined);
 const icons=["crown","mic","house","chest","medal"];
 return rooms.length?rooms.map((r,i)=>'<button class="card rm" type="button" data-act="enter" data-id="'+safe(r.id)+'"><div class="th">'+refImg(icons[i%icons.length],46)+'</div><div class="ref-room-copy"><span class="live">LIVE</span><h4>'+safe(r.name)+'</h4><small>'+safe(r.country_code||"Global")+' · 👥 '+fmt(r.active_count)+' active · '+fmt(r.seat_count)+' seats</small></div></button>').join(""):'<div class="card empty">'+(search?'No matching rooms in these results. Clear search or change filters.':'No live rooms yet. Open Rooms to create one.')+'</div>';
}
function roomPager(){
 return S.tab==="rooms"&&Number.isSafeInteger(S.roomNextOffset)
  ? '<div class="ref-room-more"><button type="button" class="gold" data-act="moreRooms" style="width:100%">Load More Rooms</button></div>'
  : '';
}
async function go(tab){
  if(!S.token)return showLogin();const requestToken=S.token,requestSeq=++S.navigationSeq;S.tab=tab;nav();E("main").innerHTML='<div class="card empty">Loading from server…</div>';
  try{
   if(tab==="home"||tab==="rooms"){
    const homeCountry=String((S.user&&S.user.country_code)||"").toUpperCase();
    const filters=new URLSearchParams({scope:tab==="home"?"all":S.scope,sort:tab==="home"?"popular":S.sort,limit:tab==="home"?"5":"50"});
    if(/^[A-Z]{2}$/.test(homeCountry))filters.set("home_country",homeCountry);
    if(tab==="rooms"&&S.country)filters.set("country",S.country);
    if(tab==="rooms"&&S.roomSearch.trim())filters.set("q",S.roomSearch.trim());
    const page=await api("/api/v1/rooms?"+filters.toString());
    if(requestSeq!==S.navigationSeq||requestToken!==S.token||S.tab!==tab)return;
    S.rooms=page.rooms||[];
    if(tab==="rooms")S.roomNextOffset=Number.isSafeInteger(page.next_offset)?page.next_offset:null;
   }else if(tab==="moments"){S.moments=(await api("/api/v1/moments?limit=20")).moments||[];}
   else if(tab==="messages"){S.threads=(await api("/api/v1/messages/threads")).conversations||[];}
   else if(tab==="ranking"){
    const result=await api("/api/v1/rankings/rooms?period="+encodeURIComponent(S.rankingPeriod));
    if(result.metric!=="room_entries"||!Array.isArray(result.rooms))throw Error("Invalid ranking response");
    S.rankRooms=result.rooms;
   }
   else if(tab==="wallet"){
    const data=await api("/api/v1/me/wallets");
    if(!Array.isArray(data.wallets)||!Array.isArray(data.entries)||data.transactions_enabled!==false)throw Error("Invalid wallet response");
    S.wallets=data.wallets;S.walletEntries=data.entries;
   }
   else if(tab==="profile"){
    const data=await Promise.all([api("/api/v1/me"),api("/api/v1/staff/access"),api("/api/v1/me/social")]);
    if(requestSeq!==S.navigationSeq||requestToken!==S.token||S.tab!==tab)return;
    if(!data[2].social||!Number.isSafeInteger(data[2].social.followers)||!Number.isSafeInteger(data[2].social.following))throw Error("Invalid social data");
    S.user=data[0].user;S.moderator=!!data[1].moderator;S.social=data[2].social;refreshHeaderAvatar();
   }else if(tab==="reports"){S.myReports=(await api("/api/v1/me/reports")).reports||[];}
   else if(tab==="blocked"){S.blockedUsers=(await api("/api/v1/me/blocks")).blocked_users||[];}
    else if(tab==="following"){S.myFollowing=(await api("/api/v1/me/following")).following||[];}
   else if(tab==="moderation"){
    const access=await api("/api/v1/staff/access");
    if(!access.moderator)throw Error("Moderator permission required.");
    S.moderator=true;
    const result=await api("/api/v1/staff/reports?status="+encodeURIComponent(S.reportStatus));
    S.reviewQueue=result.reports||[];
   }
   if(S.tab!==tab||requestToken!==S.token||requestSeq!==S.navigationSeq)return;render();
  }catch(e){if(S.tab!==tab||requestToken!==S.token||requestSeq!==S.navigationSeq)return;E("main").innerHTML='<div class="card"><b>Server unavailable</b><p class="muted">'+safe(e.message)+'</p><button class="gold" data-act="tab" data-value="'+safe(tab)+'">Retry</button></div>';}
 }

 function startApp(){E("login").hidden=true;E("header").hidden=E("main").hidden=E("nav").hidden=false;refreshHeaderAvatar();nav();go("home");}

 async function heartbeat(){
   if(!S.roomId || S.heartbeatUnsupported)return;
   const roomId=S.roomId;
   try {
     const response=await api("/api/v1/rooms/"+roomId+"/heartbeat","POST",{});
     if(roomId!==S.roomId)return;
     if(response.active===false){endLocalRoom("Room session expired. Rejoin to continue.");}
   }catch(error){
     if(error.message==="not_found"){
       // The older deployed Worker has no endpoint yet; no disruptive alert.
       S.heartbeatUnsupported=true;clearInterval(S.heartbeatTimer);S.heartbeatTimer=null;return;
     }
     if(error.message==="join_room_first"){endLocalRoom("Session expired. Please rejoin the room.");}
   }
 }

 async function stopVoice(){

   // a stale RealtimeKit SDK/token promise to settle before it can connect.

 async function joinVoice(){
   const roomId=S.roomId;
   if(!roomId||S.voice.busy)return;
   const currentGeneration=S.voice.generation;
   const stillCurrent=()=>S.roomId===roomId&&S.voice.generation===currentGeneration;
   const active=S.voice.meeting;
   if(active&&S.voice.roomId===roomId){
     if(S.voice.role!=="speaker"){
       toast("Listening only. Choose a free seat to activate your mic.");return;
     }
     S.voice.busy=true;S.voice.busyGeneration=currentGeneration;
     try{
       if(active.self.audioEnabled){
         await active.self.disableAudio();
       }else{
         // The server, not the UI button, decides who can publish audio.
         const fresh=await api("/api/v1/rooms/"+roomId+"/voice/status");
         if(!stillCurrent())return;
         if(fresh.role!=="speaker"||!fresh.seat){
           await stopVoice();
           toast("Choose a seat before opening the microphone.");
           return;
         }
         await active.self.enableAudio();
       }
       if(stillCurrent())voiceStatus(active.self.audioEnabled?"Mute Mic":"Unmute Mic");
     }catch(error){if(stillCurrent()){voiceNet("Microphone error · check permission");toast("Microphone: "+error.message);}}
     finally{if(S.voice.busyGeneration===currentGeneration){S.voice.busy=false;S.voice.busyGeneration=-1;}}
     return;
   }
   S.voice.busy=true;S.voice.busyGeneration=currentGeneration;
   voiceStatus("Connecting…");voiceNet("Joining voice · checking audio connection");
   let meeting=null;
   try{
     const status=await api("/api/v1/rooms/"+roomId+"/voice/status");
     if(!status.configured)throw Error("Voice server is not configured.");
     if(!stillCurrent())return;
     // Core SDK manages WebRTC; Web Components additionally renders remote audio.
     const [sdk]=await Promise.all([loadVoiceSdk(),loadVoiceUi()]);
     if(!stillCurrent())return;
     const response=await api("/api/v1/rooms/"+roomId+"/voice/token","POST",{});
     if(!stillCurrent())return;
     meeting=await sdk.init({authToken:response.token,defaults:{audio:false,video:false}});
     if(!stillCurrent())return;
     const liveMeeting=meeting;
     const transports={consuming:"waiting",producing:"waiting"};
     if(typeof (liveMeeting.meta && liveMeeting.meta.on)==="function"){
       liveMeeting.meta.on("mediaConnectionUpdate",({transport,state})=>{
         if(transport!=="consuming"&&transport!=="producing")return;
         if(!["new","connecting","connected","disconnected","reconnecting","failed"].includes(state))return;
         transports[transport]=state;
         if(S.voice.meeting===liveMeeting&&S.voice.roomId===roomId)showVoiceTransports(transports);
       });
     }
     if(typeof (liveMeeting.self && liveMeeting.self.on)==="function"){
       liveMeeting.self.on("roomLeft",({state})=>{
         if(S.voice.meeting!==liveMeeting||S.voice.roomId!==roomId)return;
         if(state==="kicked"||state==="ended"){
           endLocalRoom("Voice session "+state+". Rejoin if allowed.");
         }else{
           void stopVoice();
           toast("Voice disconnected. Tap Join Voice to retry.");
         }
       });
     }
     const audio=E("suraVoiceAudio"),preloaded=E("suraRemoteAudio");
     if(!audio||!preloaded||preloaded.tagName!=="AUDIO")throw Error("Remote audio renderer unavailable");
     // Reuse one preloaded element for RealtimeKit participant audio.
     preloaded.autoplay=true;preloaded.muted=false;
     audio.preloadedAudioElem=preloaded;
     audio.meeting=meeting;
     await meeting.join();
     if(!stillCurrent())return;
     // Default microphone OFF even for a seated speaker.
     if(meeting.self.audioEnabled)await meeting.self.disableAudio();
     if(!stillCurrent())return;
     S.voice.meeting=meeting;
     S.voice.roomId=roomId;
     S.voice.role=response.role;
     showVoiceTransports(transports);
     meeting=null; // Ownership transferred to S.voice; catch must not disconnect it.
     voiceStatus(response.role==="speaker"?"Unmute Mic":"Listening");
     toast(response.role==="speaker"
       ?"Voice joined. Tap Unmute Mic to speak."
       :"Voice joined. Pick a seat to speak.");
   }catch(error){
     if(stillCurrent()){
       E("suraVoiceAudio").meeting=undefined;
       E("suraVoiceAudio").preloadedAudioElem=undefined;
       const preloaded=E("suraRemoteAudio");
       if(preloaded){preloaded.pause();preloaded.srcObject=null;}
       voiceStatus("Retry Voice");voiceNet("Voice unavailable · tap Retry Voice");
       toast("Voice connection failed: "+error.message);
     }
   }finally{
     if(meeting)try{await meeting.leave();}catch(_){}
     // An old request must not unlock a newer room’s active Join Voice flow.
     if(S.voice.busyGeneration===currentGeneration){S.voice.busy=false;S.voice.busyGeneration=-1;}
   }
 }

 function stableSeatSignature(seats){
  // Ignore server-side updated_at timestamps: rebuilding the grid for heartbeat
  // changes makes seat icons shake and interrupts user taps.
  return JSON.stringify((seats||[]).map(s=>[
   Number(s.seat_number),String(s.public_id||""),String(s.display_name||""),String(s.avatar_key||""),Boolean(s.is_locked)
  ]));

 function syncRoom(){
  if(!S.roomId)return Promise.resolve();
  if(S.roomSyncPromise)return S.roomSyncPromise;
  const id=S.roomId,generation=S.roomGeneration;
  const task=(async()=>{
   const [a,chatResult]=await Promise.all([
    api("/api/v1/rooms/"+id+"/seats"),
    api("/api/v1/rooms/"+id+"/messages?after="+S.after)
      .then(data=>({data}),error=>({error}))
   ]);
   if(id!==S.roomId||generation!==S.roomGeneration)return;
   if(!a||!a.room||!Array.isArray(a.seats))throw Error("Invalid room seat response");
   E("roomName").textContent=a.room.name;
   E("roomInfo").textContent=a.room.seat_count+" seats · "+a.room.status;
   E("announcement").textContent=a.room.announcement||"No announcement";
   const sig=stableSeatSignature(a.seats);
   if(sig!==S.seatSig){
    S.lastRoomSeats=a.seats;
    S.seatSig=sig;
    E("seats").innerHTML=a.seats.map(s=>'<button class="seat" data-act="'+(s.public_id?(String(s.public_id).replace(/^SC(?=\d+$)/,"")===String(S.user&&S.user.public_id)?"stand":"member"):"seat")+'" data-id="'+safe(s.public_id||"")+'" data-n="'+Number(s.seat_number)+'" aria-label="'+(String(s.public_id||"").replace(/^SC(?=\d+$)/,"")===String(S.user&&S.user.public_id)?"My seat "+Number(s.seat_number)+". Tap to leave seat.":"Seat "+Number(s.seat_number))+'"><div class="av">'+(s.is_locked?'🔒':s.public_id?avatarHtml(s):'＋')+'</div><small>'+safe(String(s.public_id||"").replace(/^SC(?=\d+$)/,"")===String(S.user&&S.user.public_id)?"You · tap to stand":s.display_name||(s.is_locked?'Locked':'Open'))+'</small><small>'+Number(s.seat_number)+'</small></button>').join("");
   }
   if(chatResult.error){
    if(!S.chatError){S.chatError=true;toast("Messages delayed; retrying automatically.");}
    return; // Show updated room and seats even if chat is temporarily unavailable.
   }
   const b=chatResult.data;
   if(!b||!Array.isArray(b.messages))throw Error("Invalid room chat response");
   S.chatError=false;
   for(const m of b.messages){
    const messageId=Number(m.id)||0;
    if(messageId<=S.after)continue;
    const p=document.createElement("p"),name=document.createElement("b");
    name.textContent=m.sender_name?m.sender_name+": ":"";
    if(/^[0-9]{7,8}$/.test(String(m.sender_public_id||""))){
      const memberButton=document.createElement("button");memberButton.type="button";
      memberButton.className="chat-member-name";memberButton.dataset.act="member";
      memberButton.dataset.id=String(m.sender_public_id);memberButton.textContent=name.textContent;
      p.appendChild(memberButton);
    }else p.appendChild(name);
    p.appendChild(document.createTextNode(m.body||""));
    E("chat").appendChild(p);S.after=messageId;
   }
   while(E("chat").childNodes.length>80)E("chat").removeChild(E("chat").firstChild);
   if(b.messages.length)E("chat").scrollTop=E("chat").scrollHeight;
  })();
  S.roomSyncPromise=task;
  // Clear even after failed fetch, so the next 4-second poll can retry.
  task.then(()=>{if(S.roomSyncPromise===task)S.roomSyncPromise=null;},
            ()=>{if(S.roomSyncPromise===task)S.roomSyncPromise=null;});
  return task;
 }

 async function makeAvatarWebp(file){
  if(!file||!file.type||!file.type.startsWith("image/"))throw Error("Please choose a photo.");
  if(file.size>10*1024*1024)throw Error("Photo must be smaller than 10 MB.");
  const url=URL.createObjectURL(file);
  try{
   const img=new Image();
   await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(Error("Cannot read selected photo"));img.src=url;});
   if(!img.naturalWidth||!img.naturalHeight)throw Error("Invalid photo.");
   // The staging Worker requires a valid WEBP payload <=256,000 bytes.
   const canvas=document.createElement("canvas"),ctx=canvas.getContext("2d");
   if(!ctx)throw Error("Image conversion unavailable.");
   let side=480,quality=.84;
   for(let attempt=0;attempt<8;attempt++){
    const scale=Math.min(1,side/Math.max(img.naturalWidth,img.naturalHeight));
    canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
    canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/webp",quality));
    if(blob&&blob.type==="image/webp"&&blob.size>20&&blob.size<=256000)return blob;
    side=Math.max(160,Math.floor(side*.75));
    quality=Math.max(.48,quality-.06);
   }
   throw Error("Could not reduce this photo. Choose a smaller image.");
  }finally{URL.revokeObjectURL(url);}
 }

   S.roomLoadingMore=true;el.disabled=true;el.textContent="Loading rooms…";
   try{
    const home=String((S.user&&S.user.country_code)||"").toUpperCase();
    const filters=new URLSearchParams({scope,sort,limit:"50",q:search,offset:String(offset)});
    if(country)filters.set("country",country);
    if(/^[A-Z]{2}$/.test(home))filters.set("home_country",home);
    const page=await api("/api/v1/rooms?"+filters.toString());
    if(S.tab!=="rooms"||S.token!==requestToken||navSeq!==S.navigationSeq||searchSeq!==roomSearchSeq||
      scope!==S.scope||sort!==S.sort||country!==S.country||search!==S.roomSearch.trim())return;
    const seen=new Set(S.rooms.map(r=>r.id));
    for(const room of page.rooms||[])if(!seen.has(room.id)){seen.add(room.id);S.rooms.push(room);}
    S.roomNextOffset=(page.rooms||[]).length&&Number.isSafeInteger(page.next_offset)?page.next_offset:null;
    const host=E("roomResults");if(host)host.innerHTML=roomCards()+roomPager();
   }finally{S.roomLoadingMore=false;el.disabled=false;el.textContent="Load More Rooms";}
  }
  else if(a==="rankPeriod"){if(!["daily","weekly","monthly"].includes(el.dataset.value))throw Error("Invalid ranking period");S.rankingPeriod=el.dataset.value;await go("ranking");}
  else if(a==="applyCountry"){const code=String((E("roomCountry")&&E("roomCountry").value)||"").trim().toUpperCase();if(code&&!/^[A-Z]{2}$/.test(code))return toast("Enter a 2-letter country code, such as BD.");S.country=code;go("rooms");}
  else if(a==="allCountries"){S.country="";go("rooms");}
  else if(a==="myCountry"){const code=String((S.user&&S.user.country_code)||"").trim().toUpperCase();if(!/^[A-Z]{2}$/.test(code))return toast("Your account has no valid country code.");S.country=code;go("rooms");}
  else if(a==="enter")await enter(el.dataset.id);
  else if(a==="leave")await leave();
  else if(a==="seat"){
   const room=S.roomId;if(!room)return;
   if((S.lastRoomSeats||[]).some(seat=>String(seat.public_id||"").replace(/^SC(?=\d+$)/,"")===String(S.user&&S.user.public_id))){
    toast("You are already seated. Tap your seat to stand before choosing a new one.");return;
   }
   await api("/api/v1/rooms/"+room+"/seats/"+el.dataset.n,"POST",{});
   if(room!==S.roomId)return;
   await syncRoom();
   if(S.voice.meeting){await stopVoice();if(room===S.roomId)void joinVoice();}
  }
  else if(a==="stand"){
   const room=S.roomId;if(!room)return;
   const wasListening=!!(S.voice.meeting&&S.voice.roomId===room);
   // Keep voice connected if the server refuses to release the seat.
   await api("/api/v1/rooms/"+room+"/stand","POST",{});
   if(room!==S.roomId)return;
   await stopVoice();await syncRoom();
   if(wasListening&&room===S.roomId)void joinVoice(); // Rejoin as listener; mic muted.
  }
  else if(a==="member")await openMemberProfile(el.dataset.id);
  else if(a==="closeMemberProfile")closeMemberProfile();
  else if(a==="memberMessage"){const id=S.memberProfileId;closeMemberProfile();if(S.roomId)await leave(null);await openDm(id);}
  else if(a==="memberFollow"){
    const id=S.memberProfileId,follow=el.dataset.value==="true";
    if(!id)return;
    el.disabled=true;
    try{
     await api("/api/v1/me/following","POST",{public_id:id,follow});
     toast(follow?"Following member":"Member unfollowed");
     if(S.tab==="following")void go("following");
     await openMemberProfile(id);
    }finally{el.disabled=false;}
   }
   else if(a==="memberBlock"){
   const id=S.memberProfileId,blocked=el.dataset.value==="true";
   if(!id)return;
   await api("/api/v1/me/blocks","POST",{public_id:id,blocked});
   toast(blocked?"Member blocked. Private messages are disabled.":"Member unblocked.");
   if(S.tab==="dm"&&blocked)void go("messages");
   await openMemberProfile(id);
  }
  else if(a==="memberReport"){
   const form=E("memberReportForm");if(form){form.hidden=!form.hidden;if(!form.hidden)form.querySelector("select").focus();}
  }
  else if(a==="saveAvatar")await saveAvatar();
  else if(a==="roomManage"){E("roomQuickMenu").hidden=true;if(E("roomManageButton").hidden){toast("Room management is only for room owners and admins.");}else if(E("roomManagePanel").hidden)await loadRoomManage(true);else E("roomManagePanel").hidden=true;}
  else if(a==="closeRoomManage"){E("roomManagePanel").hidden=true;}
  else if(a==="roomMemberAction")await doRoomMemberAction(el.dataset.value,el.dataset.id);
  else if(a==="roomSeatLock")await doRoomSeatLock(Number(el.dataset.n),el.dataset.value);
  else if(a==="roomAdminToggle")await doRoomAdminToggle(el.dataset.id,el.dataset.value==="true");
  else if(a==="messageFocus"){const box=E("chatForm").querySelector("input[name=message]");if(box)box.focus();}
  else if(a==="roomQuickMenu"){E("roomQuickMenu").hidden=!E("roomQuickMenu").hidden;}
  else if(a==="closeQuickMenu"){E("roomQuickMenu").hidden=true;}
  else if(a==="roomRewards")toast("Room rewards are not active on this staging server yet.");
  else if(a==="roomInvite"){
   const room=String(S.roomId||"");
   if(!/^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(room))throw Error("Open a room first.");
   const message="Join my SURA CHAT room. Open Rooms, choose Join by invitation code, and paste this code: "+room;
   let shared=false;
   if(navigator.share)try{await navigator.share({title:"SURA CHAT Room",text:message});shared=true;}catch(error){
    if(error&&error.name==="AbortError")return;
   }
   if(!shared){
    try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(room);shared=true;}}catch(error){}
   }
   if(!shared){
    const field=document.createElement("textarea");
    field.value=room;field.style.position="fixed";field.style.opacity="0";document.body.appendChild(field);field.select();
    try{shared=!!document.execCommand("copy");}catch(error){}
    field.remove();
   }
   if(shared)toast("Room code shared or copied. Friends can paste it in Rooms.");
   else window.prompt("Copy and send this room code to your friend:",room);
  }
  else if(a==="roomGiftPreview")await openRoomGiftPreview();
  else if(a==="closeGiftPreview"){E("roomGiftPreview").hidden=true;}
  else if(a==="voice")await joinVoice();
  else if(a==="catalog"){if(S.roomId)void leave("catalog");else go("catalog");}
  else if(a==="openDm")await openDm(el.dataset.id);
  else if(a==="reportFilter"){S.reportStatus=el.dataset.value;await go("moderation");}
  else if(a==="unblockUser"){
   const id=String(el.dataset.id||"");
   if(!/^[0-9]{7,8}$/.test(id))throw Error("Invalid member ID");
   await api("/api/v1/me/blocks","POST",{public_id:id,blocked:false});
   toast("Member unblocked.");await go("blocked");
  }
  else if(a==="retrySavedLogin")await restoreSavedLogin();
  else if(a==="logout"){
   if(S.roomId)await leave(null);
   await stopVoice();
   await api("/api/v1/auth/logout","POST",{}).catch(()=>{});
   showLogin(true);
  }
 }catch(err){toast(err.message);}});
 E("memberProfileSheet").addEventListener("click",e=>{if(e.target===E("memberProfileSheet"))closeMemberProfile();});
 let roomSearchTimer=null,roomSearchSeq=0;
 document.addEventListener("input",e=>{
  if(e.target.id!=="roomSearch")return;
  S.roomSearch=String(e.target.value||"");
  S.roomNextOffset=null;
  const results=E("roomResults");if(results)results.innerHTML=roomCards()+roomPager();
  clearTimeout(roomSearchTimer);
  const seq=++roomSearchSeq,token=S.token,query=S.roomSearch.trim();
  roomSearchTimer=setTimeout(async()=>{
   if(S.tab!=="rooms"||token!==S.token)return;
   const home=String((S.user&&S.user.country_code)||"").toUpperCase();
   const filters=new URLSearchParams({scope:S.scope,sort:S.sort,limit:"50",q:query});
   if(S.country)filters.set("country",S.country);
   if(/^[A-Z]{2}$/.test(home))filters.set("home_country",home);
   try{
    const response=await api("/api/v1/rooms?"+filters.toString());
    if(seq!==roomSearchSeq||S.tab!=="rooms"||token!==S.token)return;
    S.rooms=response.rooms||[];
    S.roomNextOffset=Number.isSafeInteger(response.next_offset)?response.next_offset:null;
    const host=E("roomResults");if(host)host.innerHTML=roomCards()+roomPager();
   }catch(error){
    if(seq===roomSearchSeq&&S.tab==="rooms")toast("Room search: "+error.message);
   }
  },400);
 });
 document.addEventListener("submit",async e=>{const form=e.target;if(!form.id&&!form.classList.contains("report-review"))return;e.preventDefault();const d=new FormData(form);const btn=form.querySelector("button[type=submit],button.gold");if(btn)btn.disabled=true;
  try{
   if(form.id==="authForm"){const generation=++S.authGeneration;const payload={email:String(d.get("email")).trim(),password:String(d.get("password"))};if(S.signup){payload.display_name=String(d.get("display_name")).trim();payload.country_code=String(d.get("country_code")).trim().toUpperCase();if(payload.password.length<10||payload.password.length>64||!/[A-Za-z]/.test(payload.password)||!/[0-9]/.test(payload.password))throw Error("invalid_signup");}if(btn)btn.textContent=S.signup?"Creating account…":"Signing in…";const r=await api(S.signup?"/api/v1/auth/signup":"/api/v1/auth/login","POST",payload);if(generation!==S.authGeneration)return;if(!r||typeof r.token!=="string"||!r.user||!r.user.public_id)throw Error("invalid_response");S.token=r.token;S.user=r.user;if(d.get("remember")==="on")rememberLogin(r.token,r.expires_in);else forgetSavedLogin();startApp();toast("Welcome to SURA CHAT");}
   else if(form.id==="joinRoomCode"){
    const code=String(d.get("room_code")||"").trim();
    if(!/^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(code))throw Error("Use a valid room invitation code.");
    await enter(code);
   }
   else if(form.id==="createRoom"){
    const created=await api("/api/v1/rooms","POST",{name:String(d.get("name")).trim(),seat_count:Number(d.get("seat_count"))});
    if(!created.room||!created.room.id)throw Error("Server did not return a room code");
    toast("Room created. Opening room…");await enter(created.room.id);
   }
   else if(form.id==="roomSettingsForm"){const room=S.roomId;if(!room||!S.roomManage||S.roomManage.my_permission!=="owner")throw Error("Owner only");await api("/api/v1/rooms/"+room+"/settings","POST",{name:String(d.get("name")).trim(),announcement:String(d.get("announcement")).trim(),status:String(d.get("status")),seat_count:Number(d.get("seat_count"))});if(S.roomId===room){await loadRoomManage(true);await syncRoom();toast("Room settings saved");}}
   else if(form.id==="chatForm"){await api("/api/v1/rooms/"+S.roomId+"/messages","POST",{message:String(d.get("message")).trim()});form.reset();await syncRoom();}
   else if(form.id==="newMoment"){await api("/api/v1/moments","POST",{body:String(d.get("body")).trim()});toast("Moment posted");go("moments");}
   else if(form.classList.contains("report-review")){
    if(!S.moderator)throw Error("Moderator permission required.");
    const id=String(form.dataset.reportId||"");
    if(!/^[0-9a-f-]{36}$/i.test(id))throw Error("Invalid report ID");
    await api("/api/v1/staff/reports/"+encodeURIComponent(id)+"/review","POST",{
      status:String(d.get("status")),note:String(d.get("note")||"")
    });
    toast("Review saved.");await go("moderation");
   }
   else if(form.id==="memberReportForm"){
    if(!S.memberProfileId)throw Error("Open a member first.");
    await api("/api/v1/reports","POST",{
      public_id:S.memberProfileId,reason:String(d.get("reason")),
      details:String(d.get("details")||""),context_type:"profile"
    });
    toast("Report submitted for review.");closeMemberProfile();
   }
   else if(form.id==="findMember")await openMemberProfile(String(d.get("id")));
   else if(form.id==="findDm")await openDm(String(d.get("id")));
   else if(form.id==="sendDm"){await api("/api/v1/messages/"+S.peer,"POST",{message:String(d.get("message")).trim()});await openDm(S.peer);}
   else if(form.id==="changePasswordForm"){
    const current=String(d.get("current_password")||"");
    const next=String(d.get("new_password")||"");
    if(next!==String(d.get("confirm_password")||""))throw Error("Passwords do not match.");
    if(next.length<10||next.length>64||!/[A-Za-z]/.test(next)||!/[0-9]/.test(next))throw Error("Use 10–64 characters with letters and numbers.");
    const r=await api("/api/v1/auth/change-password","POST",{current_password:current,new_password:next});
    if(!r.password_changed)throw Error("Password not changed.");
    form.reset();toast("Password changed; other phones signed out.");
   }
   else if(form.id==="revokeOthersForm"){
    const r=await api("/api/v1/auth/revoke-other-sessions","POST",{current_password:String(d.get("current_password")||"")});
    if(!r.other_sessions_revoked)throw Error("Could not sign out other phones.");
    form.reset();toast("Signed out "+fmt(r.count)+" other session(s).");
   }
   else if(form.id==="editProfile"){const r=await api("/api/v1/me/profile","POST",{display_name:String(d.get("display_name")).trim(),bio:String(d.get("bio")).trim(),country_code:String(d.get("country_code")||"").trim().toUpperCase()});S.user={...S.user,...r.user};toast("Saved");render();}
  }catch(err){if(form.id==="authForm")showAuthIssue(authMessage(err,S.signup));else toast(err.message);}finally{if(btn){btn.disabled=false;if(form.id==="authForm")btn.textContent=S.signup?"Create Account":"Sign In";}}
 });
 window.suraBack=function(){
  if(!E("memberProfileSheet").hidden){closeMemberProfile();return true;}
  if(S.roomId){
   if(!E("roomGiftPreview").hidden){E("roomGiftPreview").hidden=true;return true;}
   if(!E("roomQuickMenu").hidden){E("roomQuickMenu").hidden=true;return true;}
   if(!E("roomManagePanel").hidden){E("roomManagePanel").hidden=true;return true;}
   void leave();return true;
  }
  if(!E("login").hidden)return false;
  if(S.tab!=="home"){go("home");return true;}
  return false;
 };
 document.addEventListener("visibilitychange",()=>{
  if(!S.roomId)return;
  if(document.hidden){
    // Stop repeated room rendering while hidden, but continue best-effort presence
    // heartbeats so a brief app switch does not immediately abandon the room.
    // Android may still suspend WebView JS: this is not a background-audio guarantee.
    clearInterval(S.poll);S.poll=null;
  }else{
    void heartbeat(); // Validate membership immediately after app resumes.
    if(!S.poll)S.poll=setInterval(()=>syncRoom().catch(()=>{}),4000);
    if(!S.heartbeatUnsupported&&!S.heartbeatTimer)S.heartbeatTimer=setInterval(()=>{void heartbeat();},25000);
    void syncRoom().catch(error=>toast("Room refresh: "+error.message));
  }
});
 showLogin();void restoreSavedLogin();
})();</script></body></html>
