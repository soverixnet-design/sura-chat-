plugins { id 'com.android.application' }

android {
    namespace 'com.soverixnet.surachat'
    compileSdk 35
    defaultConfig {
        applicationId 'com.soverixnet.surachat'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.4.0-html-api-staging'
    }
    buildTypes {
        debug {
            buildConfigField 'String', 'API_BASE_URL', '"https://sura-chat-api-staging.soverixnet.workers.dev"'
        }
        release {
            // Production backend not validated: fails closed.
            buildConfigField 'String', 'API_BASE_URL', '""'
            minifyEnabled false
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
