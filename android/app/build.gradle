plugins { id 'com.android.application' }

android {
    namespace 'com.soverixnet.surachat'
    compileSdk 35
    defaultConfig {
        applicationId 'com.soverixnet.surachat'
        minSdk 26
        targetSdk 35
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode 12
        versionName '0.5.7-room-manager-staging'
    }
    buildTypes {
        debug {
            buildConfigField 'String', 'API_BASE_URL', '"https://sura-chat-api-staging.soverixnet.workers.dev"'
        }
        release {
            // Production backend not validated: fails closed.
            buildConfigField 'String', 'API_BASE_URL', '""'
            minifyEnabled false
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.18.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
