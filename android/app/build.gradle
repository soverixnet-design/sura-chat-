plugins { id 'com.android.application' }

android {
    namespace 'com.soverixnet.surachat'
    compileSdk 35
    defaultConfig {
        applicationId 'com.soverixnet.surachat'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-staging'
    }
    buildTypes {
        debug {
            buildConfigField 'String', 'API_BASE_URL', '"https://sura-chat-api-staging.soverixnet.workers.dev"'
        }
        release {
            // Fail closed until a production SURA backend is configured and approved.
            buildConfigField 'String', 'API_BASE_URL', '""'
            minifyEnabled false
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
