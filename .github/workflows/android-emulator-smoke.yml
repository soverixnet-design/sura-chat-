name: SURA Android emulator runtime smoke
on:
  push:
    branches:
      - feature/sura-android-emulator-smoke-20261112
    paths:
      - 'android/**'
      - '.github/workflows/android-emulator-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webview-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real Android WebView runtime smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle -p android :app:connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Save Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sura-android-emulator-smoke-results
          path: |
            android/app/build/outputs/androidTest-results/connected/**
            android/app/build/reports/androidTests/connected/**
          if-no-files-found: warn
          retention-days: 7
