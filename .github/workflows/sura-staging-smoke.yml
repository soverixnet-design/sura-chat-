name: SURA staging API HTTP smoke
on:
  push:
    branches:
      - 'feature/sura-presence-heartbeat-20261112'
      - 'feature/sura-user-reference-mobile-ui-20261112'
    paths:
      - '.github/workflows/sura-staging-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify staging database, HTTP routing and anonymous permissions
        env:
          SURA_API_URL: https://sura-chat-api-staging.soverixnet.workers.dev
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request
          import urllib.error

          BASE = os.environ['SURA_API_URL'].rstrip('/')

          def check(path, method='GET'):
              req = urllib.request.Request(
                  BASE + path, method=method,
                  headers={'Accept': 'application/json',
                           'Content-Type': 'application/json',
                           'User-Agent': 'sura-chat-staging-ci-smoke'}
              )
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=12) as response:
                          return response.status, json.loads(response.read())
                  except urllib.error.HTTPError as exc:
                      return exc.code, json.loads(exc.read())
                  except (urllib.error.URLError, TimeoutError):
                      if attempt == 2:
                          raise
                      time.sleep(3)

          status, data = check('/health')
          assert status == 200, ('/health', status, data)
          assert data.get('app') == 'SURA CHAT', data
          assert data.get('database') == 'connected', data
          print('OK health: dedicated SURA staging DB connected')

          status, data = check('/api/v1/config')
          assert status == 200, ('/api/v1/config', status, data)
          assert data.get('app') == 'SURA CHAT', data
          print('OK config: real SURA API available')

          status, data = check('/api/v1/rooms')
          assert status == 200 and isinstance(data.get('rooms'), list), (status, data)
          print('OK rooms: real API returns data, count=', data.get('count'))

          status, data = check('/api/v1/rooms?q=royal&country=BD')
          assert status == 200 and isinstance(data.get('rooms'), list), (status, data)
          print('OK named room search: protected SQL filter is live')

          status, data = check('/api/v1/rankings/rooms?period=weekly')
          assert status == 200, ('/api/v1/rankings/rooms', status, data)
          assert data.get('metric') == 'room_entries' and data.get('period') == 'weekly', data
          assert isinstance(data.get('rooms'), list), data
          for room in data['rooms']:
              assert isinstance(room.get('join_events'), int) and room['join_events'] >= 0, room
              assert isinstance(room.get('unique_visitors'), int) and room['unique_visitors'] >= 0, room
              assert 'wallet_balance' not in room and 'owner_user_id' not in room, room
          status, data = check('/api/v1/rankings/rooms?period=unlimited')
          assert status == 400 and data.get('error') == 'invalid_rank_filter', (status, data)
          print('OK activity ranking: real audit counts, safe fields and strict window validation')

          status, data = check('/api/v1/me/blocks')
          assert status == 401 and data.get('error') == 'login_required', (status, data)
          status, data = check('/api/v1/reports', method='POST')
          assert status == 401 and data.get('error') == 'login_required', (status, data)
          print('OK member safety endpoints reject anonymous access')

          status, data = check('/api/v1/me/reports')
          assert status == 401 and data.get('error') == 'login_required', (status, data)
          status, data = check('/api/v1/staff/access')
          assert status == 401 and data.get('error') == 'login_required', (status, data)
          status, data = check('/api/v1/staff/reports?status=open')
          assert status == 401 and data.get('error') == 'login_required', (status, data)
          status, data = check('/api/v1/staff/reports/00000000-0000-4000-8000-000000000001/review', method='POST')
          assert status == 401 and data.get('error') == 'login_required', (status, data)
          print('OK report queue and staff review deny anonymous access')

          status, data = check('/api/v1/me')
          assert status == 401 and data.get('error') == 'login_required', (status, data)
          print('OK protected profile rejects anonymous access')

          room_id = '00000000-0000-4000-8000-000000000001'
          status, data = check('/api/v1/rooms/' + room_id + '/heartbeat', method='POST')
          assert status == 401 and data.get('error') == 'login_required', (status, data)
          print('OK new heartbeat route rejects unauthenticated writes')
          PY
