# ACME bootstrap only. Does not expose the LiveKit API or WebRTC signaling.
server {
    listen 80;
    server_name sura-live.sharika.app;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/sura-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location = /health {
        default_type application/json;
        return 200 '{"service":"sura-oracle-rtc","status":"awaiting_tls_and_rtc_configuration"}';
    }
    location / { return 503; }
}
