# Activate only after certificate, Worker authorization endpoint and LiveKit configuration exist.
server {
    listen 80;
    server_name sura-live.sharika.app;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/sura-acme; try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name sura-live.sharika.app;
    ssl_certificate /etc/letsencrypt/live/sura-live.sharika.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sura-live.sharika.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    # No token-bearing URLs in error logs during ordinary request failures.
    error_log /var/log/nginx/sura-live-error.log crit;
    location = /health { default_type application/json; return 200 '{"service":"sura-oracle-rtc","status":"proxy_ready"}'; }
    location = /_sura_authorize {
        internal;
        proxy_pass https://sura-chat-api-staging.soverixnet.workers.dev/api/v1/rtc/authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Sura-RTC-Token $sura_rtc_token;
        proxy_set_header Host sura-chat-api-staging.soverixnet.workers.dev;
        proxy_ssl_server_name on;
        proxy_ssl_name sura-chat-api-staging.soverixnet.workers.dev;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
    location /rtc {
        set $sura_rtc_token $arg_access_token;
        auth_request /_sura_authorize;
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    # LiveKit independently verifies short-lived roomAdmin JWTs for Twirp calls.
    location /twirp/livekit.RoomService/ {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }
    location / { return 404; }
}
